[project]
name = "cubesat-thermal-agent"
version = "0.1.0"
description = "Orbital thermal analysis engine for CubeSats, built to be driven by an AI agent over MCP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dante Cáceres" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]          # phase 2: MCP server (FastMCP)

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubesat_thermal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
